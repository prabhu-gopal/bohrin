name: Bug report
description: Something in Bohrin crashed or did something clearly wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The version fields below are required because without them
        almost every bug report is unactionable — we cannot tell a fixed bug from a live one.

        **If a candidate is called wrong but is actually a correct solution**, that is a false
        positive, not a bug — please use the *False positive* template instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what did you get instead?
      placeholder: |
        battery(task) raised a RecursionError on a task whose reference is a deeply nested function.
    validations:
      required: true

  - type: input
    id: bohrin-version
    attributes:
      label: Bohrin version
      description: "Output of `python -c 'import bohrin; print(bohrin.__version__)'`"
      placeholder: "0.3.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version and OS
      description: "Output of `python --version`, plus your OS"
      placeholder: "Python 3.11.9, Ubuntu 22.04"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Full output
      description: >
        The complete output, including any traceback. This is automatically formatted as
        code, so no backticks needed.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that no existing issue already reports this.
          required: true
