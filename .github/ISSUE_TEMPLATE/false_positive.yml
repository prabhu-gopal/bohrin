name: False positive
description: A candidate is called wrong (it carries a ground) but it is actually a correct solution.
title: "[false positive] "
labels: ["false-positive", "calibration"]
body:
  - type: markdown
    attributes:
      value: |
        **This is the most valuable report you can send us.**

        A candidate may be called wrong only when its wrongness is established independently
        of the grader. If one of Bohrin's grounded candidates is really a correct solution for
        your task, a correct grader would be accused of accepting wrong work. We cannot find
        those on synthetic data — we need yours.

        You do **not** need to share your environment. The operator, the task's reference
        solution, the candidate, and why it is correct are enough to act on.

  - type: input
    id: operator-id
    attributes:
      label: Operator ID
      description: The `provenance.operator` of the candidate, e.g. `drop_side_effect`.
      placeholder: "drop_side_effect"
    validations:
      required: true

  - type: textarea
    id: the-candidate
    attributes:
      label: The task's reference solution, and the candidate
      description: The reference, the candidate's payload, and its ground.
      render: shell
    validations:
      required: true

  - type: textarea
    id: why-wrong
    attributes:
      label: Why is this candidate actually correct?
      description: What does Bohrin not know about your task? This is the part we cannot guess.
      placeholder: |
        What your task allows that Bohrin assumed it does not: for example, which behaviour the
        grader is entitled to ignore, and why this candidate still meets the task.
    validations:
      required: true

  - type: input
    id: bohrin-version
    attributes:
      label: Bohrin version
      description: "Output of `python -c 'import bohrin; print(bohrin.__version__)'`"
      placeholder: "0.3.0"
    validations:
      required: true
