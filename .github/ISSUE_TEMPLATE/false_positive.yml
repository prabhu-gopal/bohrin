name: False positive
description: Bohrin reported an exploit against a verifier that is actually correct.
title: "[false positive] "
labels: ["false-positive", "calibration"]
body:
  - type: markdown
    attributes:
      value: |
        **This is the most valuable report you can send us.**

        Bohrin's only real asset is that its findings are trustworthy. A probe that
        cries wolf is worse than no probe, and we cannot find those on synthetic data —
        we need yours. Every report here goes directly into threshold calibration.

        You do **not** need to share your environment. The probe id, the numbers bohrin
        reported, and your explanation of why it is wrong is enough to act on.

  - type: input
    id: probe-id
    attributes:
      label: Detector ID
      description: >
        The bracketed id printed with the finding, e.g. `[stats.dead_dimension]`. Run
        `bohrin explain <id>` to see what it thinks it is measuring.
      placeholder: "stats.jitter_outlier"
    validations:
      required: true

  - type: textarea
    id: the-finding
    attributes:
      label: The finding, as bohrin printed it
      description: Copy the whole finding, including the candidate that passed and the wrongness ground.
      render: shell
    validations:
      required: true

  - type: textarea
    id: why-wrong
    attributes:
      label: Why is this wrong?
      description: >
        What does bohrin not know about your setup? This is the part we cannot guess.
      placeholder: |
        The candidate Bohrin submitted returns a constant, but for this task a constant IS
        the correct answer — the reward function is right to accept it. The mutation was
        behaviourally equivalent to the reference, so it should have been filtered before
        submission rather than reported as an exploit.
    validations:
      required: true

  - type: textarea
    id: environment-context
    attributes:
      label: Dataset context
      description: >
        Environment format, number of tasks, how many reward functions the task exposes,
        whether a reference solution is available, and the Hub path if it is public.
      placeholder: |
        verifiers v1 taskset, 40 tasks, 1 reward function, reference solutions present, private.
    validations:
      required: true

  - type: input
    id: bohrin-version
    attributes:
      label: Bohrin version
      description: "Output of `bohrin --version`"
      placeholder: "bohrin 0.1.0"
    validations:
      required: true

  - type: textarea
    id: json
    attributes:
      label: Report JSON (optional, but very helpful)
      description: >
        `bohrin scan <path> --json report.json` gives us the exact measured values and
        thresholds. Attach it or paste the relevant finding. It contains no raw data from
        your environment — only statistics.
      render: json
