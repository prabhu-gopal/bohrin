name: Fuzz

# Coverage-guided fuzzing of every reader of untrusted input (fuzz/fuzz_readers.py) with Atheris,
# weekly and on demand. The same check also runs on a fixed corpus and seeded mutations in every
# ordinary test run (tests/test_fuzz.py), so this job looks further, not for the first time. Not a
# required check: a fuzzer's find should be triaged, not block an unrelated pull request.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readers:
    name: fuzz the readers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Install, every file pinned by hash
        # Bohrin and its dependencies from uv.lock; the fuzzer from fuzz/requirements.txt.
        # Python 3.12: atheris 3.1 ships wheels for 3.12 and later.
        run: |
          uv sync --frozen --no-dev --python 3.12
          uv pip install --require-hashes -r fuzz/requirements.txt
      - name: Fuzz for ten minutes, from the corpus
        run: |
          mkdir -p findings
          uv run --no-sync python fuzz/fuzz_readers.py -max_total_time=600 -artifact_prefix=findings/ fuzz/corpus
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: findings/
