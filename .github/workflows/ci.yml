name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        # The suite is fully synthetic: no network, no GPU, no dataset downloads.
        run: uv run pytest -q

  # A passing test suite runs against the source tree, so it cannot catch a wheel that is
  # missing a module, an entry point, or a runtime dependency. This installs the built wheel
  # into a clean environment and uses it, which is the only way to catch that.
  smoke:
    name: installed-wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build the wheel
        run: uv build

      - name: Verify the wheel contains the package
        run: |
          ls -R dist/
          python -c "
          import zipfile, glob, sys
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.startswith('bohrin/') for n in names), 'no bohrin/ inside the wheel'
          print(f'{wheel}: {len(names)} files, package present')
          "

      - name: Install into a clean environment and use it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/fresh/bin/python -c "
          import bohrin
          from bohrin.ir.task import Task
          from bohrin.mutate import discover
          from bohrin.mutate.battery import battery
          print('bohrin', bohrin.__version__)
          operators = discover()
          assert 'drop_side_effect' in {o.id for o in operators}, f'the built-in operators did not load: {operators}'
          reference = 'def add(a, b):\n    return a + b\n'
          result = battery(Task(id='0', prompt='Write add(a, b).', reference=reference, reward_fns=('r',)))
          assert result.grounded, 'the battery produced no grounded candidate'
          print(f'{len(operators)} operators, {len(result.candidates)} candidates for a coding task')
          from bohrin.spec import weakness_list
          weaknesses = weakness_list()
          assert len(weaknesses.weaknesses) >= 38, 'the weakness list did not ship in the wheel'
          print(f'weakness list v{weaknesses.version}: {len(weaknesses.weaknesses)} classes')
          from bohrin.spec import probes
          assert {p.operator for p in probes()} == {o.id for o in operators}, 'the probe manifests did not ship'
          print(f'{len(probes())} probe manifests')
          from bohrin.evidence import SCHEMA, finding_schema
          assert finding_schema()['\$id'] == SCHEMA, 'the finding schema did not ship'
          print('finding schema', SCHEMA)
          from bohrin.evidence.reproduction import RESULT_SCHEMA, reproduction_result_schema
          assert reproduction_result_schema()['\$id'] == RESULT_SCHEMA, 'the reproduction schema did not ship'
          print('reproduction schema', RESULT_SCHEMA)
          "
          printf '%s\n' '{"task_id": "t0", "model": "a", "score": 1}' '{"task_id": "t1", "model": "a", "score": 0}' > /tmp/results.jsonl
          /tmp/fresh/bin/bohrin power /tmp/results.jsonl
          /tmp/fresh/bin/bohrin verify --since HEAD "$GITHUB_WORKSPACE"
