name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        # The suite is fully synthetic: no network, no GPU, no dataset downloads.
        run: uv run pytest -q

  # A passing test suite runs against the source tree, so it cannot catch a wheel that is
  # missing a module, an entry point, or a runtime dependency. This installs the built wheel
  # into a clean environment and uses it, which is the only way to catch that.
  smoke:
    name: installed-wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build the wheel
        run: uv build

      - name: Verify the wheel contains the package
        run: |
          ls -R dist/
          python -c "
          import zipfile, glob, sys
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.startswith('bohrin/') for n in names), 'no bohrin/ inside the wheel'
          print(f'{wheel}: {len(names)} files, package present')
          "

      - name: Install into a clean environment and use it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/fresh/bin/python -c "
          import bohrin
          from bohrin.ir.task import Task
          from bohrin.mutate import discover
          from bohrin.mutate.battery import battery
          print('bohrin', bohrin.__version__)
          operators = discover()
          assert {'constant_implementation', 'drop_side_effect', 'raise_not_implemented'} <= {o.id for o in operators}, f'the built-in operators did not load: {operators}'
          reference = 'def add(a, b):\n    return a + b\n'
          result = battery(Task(id='0', prompt='Write add(a, b).', reference=reference, reward_fns=('r',)))
          assert result.grounded, 'the battery produced no grounded candidate'
          print(f'{len(operators)} operators, {len(result.candidates)} candidates for a coding task')
          from bohrin.spec import weakness_list
          weaknesses = weakness_list()
          assert len(weaknesses.weaknesses) >= 38, 'the weakness list did not ship in the wheel'
          print(f'weakness list v{weaknesses.version}: {len(weaknesses.weaknesses)} classes')
          from bohrin.spec import probes
          from bohrin.relations import BASELINE, discover as relations
          generators = {o.id for o in operators} | {r.id for r in relations()} | {BASELINE}
          assert {p.operator for p in probes()} == generators, 'the probe manifests or the positive controls did not ship'
          print(f'{len(probes())} probe manifests')
          from bohrin.evidence import SCHEMA, finding_schema
          assert finding_schema()['\$id'] == SCHEMA, 'the finding schema did not ship'
          from bohrin.conformance import suite
          assert len(suite().fixtures) == 18 and suite().level == 'BCL-1', 'the conformance suite index did not ship'
          from bohrin.registry import REGISTRY_RECORD_SCHEMA, registry_record_schema
          assert registry_record_schema()['\$id'] == REGISTRY_RECORD_SCHEMA, 'the registry schema did not ship'
          import bohrin.api as api
          from bohrin.cli import _commands
          assert api.PLUGIN_API == 1 and {c.name for c in _commands()} >= {'power', 'verify', 'conformance'}, 'the commands did not register from the wheel'
          print('finding schema', SCHEMA)
          from bohrin.evidence.reproduction import RESULT_SCHEMA, reproduction_result_schema
          assert reproduction_result_schema()['\$id'] == RESULT_SCHEMA, 'the reproduction schema did not ship'
          print('reproduction schema', RESULT_SCHEMA)
          "
          printf '%s\n' '{"task_id": "t0", "model": "a", "score": 1}' '{"task_id": "t1", "model": "a", "score": 0}' > /tmp/results.jsonl
          /tmp/fresh/bin/bohrin power /tmp/results.jsonl
          /tmp/fresh/bin/bohrin verify --since HEAD "$GITHUB_WORKSPACE"

  # The Action this repository publishes, run on this repository: installs Bohrin from the checkout
  # and runs bohrin verify on the pull request. Not a required check; it exercises the Action.
  verify-action:
    name: bohrin verify action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run the Action from this checkout
        id: verify
        uses: ./
        with:
          package: .
          upload-sarif: "false"

      - name: Check it wrote valid SARIF
        env:
          SARIF: ${{ steps.verify.outputs.sarif-file }}
        run: python -c "import json, os; log = json.load(open(os.environ['SARIF'])); assert log['version'] == '2.1.0'; print(len(log['runs'][0]['results']), 'results')"
