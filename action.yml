name: Bohrin verify
description: State facts about what a change did to the tests and the code, as annotations on the pull request.
author: Bohrin
branding:
  icon: check-square
  color: green

inputs:
  since:
    description: >-
      The commit to compare from. Defaults to the pull request's base commit, or where the branch
      started. Check out with fetch-depth 0 so that commit is available.
    required: false
    default: ""
  strict:
    description: Fail the job on any fact, not only on facts beside a commit message that claims success.
    required: false
    default: "false"
  upload-sarif:
    description: Upload the facts to code scanning, so they appear on the pull request. Needs security-events write.
    required: false
    default: "true"
  category:
    description: The code-scanning category, so these results never replace another tool's.
    required: false
    default: bohrin-verify
  package:
    description: What to install with pip. Needs bohrin 0.4.0 or later, which adds verify.
    required: false
    default: bohrin>=0.4
  python-version:
    description: The Python to run Bohrin with.
    required: false
    default: "3.12"
  working-directory:
    description: A path inside the repository to check.
    required: false
    default: "."

outputs:
  exit-code:
    description: "What bohrin verify returned: 0 clean, 1 facts to act on, 2 could not run."
    value: ${{ steps.verify.outputs.exit-code }}
  sarif-file:
    description: The SARIF file written.
    value: ${{ steps.verify.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    # Inputs reach the shell as environment variables, never pasted into the script, so a value
    # such as a branch name cannot run as a command.
    - name: Install Bohrin
      shell: bash
      env:
        BOHRIN_PACKAGE: ${{ inputs.package }}
      run: python -m pip install --disable-pip-version-check --quiet "$BOHRIN_PACKAGE"

    - name: Run bohrin verify
      id: verify
      shell: bash
      env:
        SINCE: ${{ inputs.since || github.event.pull_request.base.sha }}
        STRICT: ${{ inputs.strict }}
        WORKDIR: ${{ inputs.working-directory }}
      run: |
        sarif="$RUNNER_TEMP/bohrin-verify.sarif"
        args=(verify --sarif "$sarif")
        if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
        if [ "$STRICT" = "true" ]; then args+=(--strict); fi
        set +e
        bohrin "${args[@]}" "$WORKDIR"
        status=$?
        set -e
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"

    - name: Upload the facts to code scanning
      if: ${{ inputs.upload-sarif == 'true' && steps.verify.outputs.exit-code != '2' }}
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ steps.verify.outputs.sarif-file }}
        category: ${{ inputs.category }}

    - name: Pass on the result
      shell: bash
      env:
        STATUS: ${{ steps.verify.outputs.exit-code }}
      run: exit "$STATUS"
