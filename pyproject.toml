[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bohrin"
dynamic = ["version"]
description = "Audits the verifier, not the model. Finds RL tasks whose grader accepts provably wrong solutions."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bohrin" }]
keywords = [
  "reinforcement-learning", "rl-environments", "reward-hacking",
  "verifier", "rlvr", "evaluation", "mutation-testing", "benchmarks",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

# Dependency policy, carried over deliberately: nothing is declared that is not imported by
# a line of code. `grep -rn "^import X\|^from X" src/bohrin/` must be non-empty for every
# entry below.
dependencies = [
  "rich>=13.7",              # terminal report rendering
  "libcst>=1.4",             # mutation operators — see docs/01_ARCHITECTURE.md
  "pyyaml>=6.0",             # bohrin.yaml
  "typing_extensions>=4.6; python_version < '3.11'",  # typing.Self backport
]

[project.optional-dependencies]
# The adapter for Prime Intellect's verifiers spec. Optional so that `pip install bohrin`
# stays small and the tool can report a clear "install this extra" message rather than an
# import error — see MissingExtraError in adapters/base.py.
verifiers = ["verifiers>=1.0"]

dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://bohrin.com"
Documentation = "https://github.com/prabhu-gopal/bohrin/tree/main/docs"
Source = "https://github.com/prabhu-gopal/bohrin"
Issues = "https://github.com/prabhu-gopal/bohrin/issues"
Changelog = "https://github.com/prabhu-gopal/bohrin/blob/main/CHANGELOG.md"

[project.scripts]
bohrin = "bohrin.cli:_run"

# ---------------------------------------------------------------------------------------
# Plugin seams. These group names are PUBLIC API: renaming one breaks every third-party
# plugin and every proprietary probe package at once. See docs/01_ARCHITECTURE.md.
#
# First-party and third-party entries use the identical mechanism — there is no privileged
# path, and nothing in this repository checks a licence.
# ---------------------------------------------------------------------------------------

[project.entry-points."bohrin.adapters"]
verifiers_v1 = "bohrin.adapters.verifiers_v1:VerifiersV1Adapter"

[project.entry-points."bohrin.probes"]
weak_oracle = "bohrin.probes.weak_oracle:WeakOracleProbe"
determinism = "bohrin.probes.determinism:DeterminismProbe"

[project.entry-points."bohrin.mutators"]
constant_return = "bohrin.mutate.operators:ConstantReturn"
empty_body      = "bohrin.mutate.operators:EmptyBody"
drop_side_effect = "bohrin.mutate.operators:DropSideEffect"
negate_condition = "bohrin.mutate.operators:NegateCondition"
off_by_one      = "bohrin.mutate.operators:OffByOne"
swap_operator   = "bohrin.mutate.operators:SwapOperator"
identity_return = "bohrin.mutate.operators:IdentityReturn"

[tool.hatch.version]
path = "src/bohrin/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bohrin"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

# ---------------------------------------------------------------------------------------
# Tooling. Carried over unchanged from the previous codebase: this configuration was
# already proven across the nine-job CI matrix and there is no reason to re-derive it.
# ---------------------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pyflakes + pycodestyle
  "I",                # isort
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "SIM",              # simplify
  "RUF",              # ruff-specific
  "TID",              # tidy-imports
  "ASYNC",            # async correctness — this codebase is async throughout
]
ignore = [
  "N818",             # exception names need not end in "Error"
  "RUF001",           # ambiguous unicode in strings — ×, →, ≥ are deliberate in user-facing text
  "RUF002",           # ambiguous unicode in docstrings — same reason
  "RUF003",           # ambiguous unicode in comments — same reason
]

[tool.ruff.lint.isort]
known-first-party = ["bohrin"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "tests"
warn_unreachable = true
warn_redundant_casts = true

# `verifiers` is an optional extra and ships no type information. Our adapter wraps it and
# is itself fully typed, so the untyped surface is confined to that one import site.
[[tool.mypy.overrides]]
module = ["verifiers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/bohrin"]
