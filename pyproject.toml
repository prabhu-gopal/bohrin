[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bohrin"
dynamic = ["version"]
description = "Check the checker: an open standard for testing the graders of RL environments, with proof before every accusation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bohrin" }]
keywords = [
  "reinforcement-learning", "rl-environments", "reward-hacking", "rlvr",
  "verifier", "grader", "reward-function", "evaluation", "llm-evaluation",
  "benchmarks", "mutation-testing", "ai-safety", "coding-agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

# Dependency policy: nothing is declared that is not imported by a line of code.
# `grep -rn "^import X\|^from X" src/bohrin/` must be non-empty for every entry below.
dependencies = [
  "libcst>=1.4",             # code-level mutation operators
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "jsonschema>=4.23",         # tests validate every emitted record against the published schemas
  "types-jsonschema>=4.23",
  "pyyaml>=6.0",              # tests read the GitHub Action and workflows as YAML
  "types-PyYAML>=6.0",
]

[project.scripts]
bohrin = "bohrin.cli:run"

[project.urls]
Homepage = "https://bohrin.com"
Documentation = "https://github.com/prabhu-gopal/bohrin/tree/main/docs"
Source = "https://github.com/prabhu-gopal/bohrin"
Issues = "https://github.com/prabhu-gopal/bohrin/issues"
Changelog = "https://github.com/prabhu-gopal/bohrin/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------------------
# Plugin seams. These group names are PUBLIC API: renaming one breaks every third-party
# plugin at once.
#
# First-party and third-party entries use the identical mechanism — there is no privileged
# path, and nothing in this repository checks a licence.
# ---------------------------------------------------------------------------------------

# Every registered operator either establishes a wrongness ground or emits leads only; see
# src/bohrin/mutate/operators.py.
[project.entry-points."bohrin.mutators"]
constant_implementation = "bohrin.mutate.operators:ConstantImplementation"
drop_side_effect = "bohrin.mutate.operators:DropSideEffect"
raise_not_implemented = "bohrin.mutate.operators:RaiseNotImplemented"

# Certified meaning-preserving rewritings of a correct solution: positive controls. Their order is
# fixed in `bohrin.relations._BUILTIN_ORDER`, not by this table.
[project.entry-points."bohrin.relations"]
comment_free   = "bohrin.relations.builtin:CommentFree"
reformatted    = "bohrin.relations.builtin:Reformatted"
renamed_locals = "bohrin.relations.builtin:RenamedLocals"

[tool.hatch.version]
path = "src/bohrin/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bohrin"]

[tool.hatch.build.targets.sdist]
include = [
  "src/", "tests/", "docs/", "conformance/", "README.md", "ARCHITECTURE.md", "CONTRIBUTING.md", "CHANGELOG.md",
  "SECURITY.md", "CODE_OF_CONDUCT.md", "CITATION.cff", "LICENSE", "NOTICE", "ERRATA.md",
]

# ---------------------------------------------------------------------------------------
# Tooling. The same configuration runs locally and in every CI job.
# ---------------------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pyflakes + pycodestyle
  "I",                # isort
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "SIM",              # simplify
  "RUF",              # ruff-specific
  "TID",              # tidy-imports
]
ignore = [
  "N818",             # exception names need not end in "Error"
  "RUF001",           # ambiguous unicode in strings — ×, →, ≥ are deliberate in user-facing text
  "RUF002",           # ambiguous unicode in docstrings — same reason
  "RUF003",           # ambiguous unicode in comments — same reason
]

[tool.ruff.lint.per-file-ignores]
# libcst's visitor protocol dictates the method names (`leave_FunctionDef`, `leave_If`).
# Renaming them to satisfy N802 would silently stop the transformer from firing.
"src/bohrin/mutate/operators.py" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["bohrin"]

[tool.mypy]
strict = true
files = ["src", "tests", "conformance"]
mypy_path = "tests"
warn_unreachable = true
warn_redundant_casts = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/bohrin"]
