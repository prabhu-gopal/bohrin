weakness = "BGW-120"
shape = "program"
defect = false

[[fixture]]
id = "bcl-1/tests-too-narrow/defect"
file = "tests-too-narrow-defect.py"
weakness = "BGW-120"
shape = "program"
defect = true

[[fixture]]
id = "bcl-1/lenient-checker/correct"
