    "The reachable functions' only work is raising an error: nothing is submitted, because one error raised for another is not provably wrong.",
    "The result compiles to the same bytecode as the reference: nothing is submitted.",
]
sources = ["https://arxiv.org/abs/2604.17596"]

[probe.template]
solution = "reference-raising"
