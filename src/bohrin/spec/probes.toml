[[probe.attribution]]
weakness = "BGW-126"
when_rejected = "bohrin/empty-implementation@1"
reason = "The grader rejected the empty implementation of the same task, so it runs the code and checks what comes back; paying for a program that only raises is scoring a failure as success, and the fix is to fail closed, not to check more values."

