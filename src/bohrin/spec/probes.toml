# Probe manifests: what every built-in probe tries, as data.
#
# A probe exists twice: as code (the operator that generates its submissions) and as this
# manifest, which a third-party tool or the conformance suite can read without importing Bohrin.
# tests/test_probes.py checks that each operator emits exactly what its manifest promises.
#
# * `id` is `<namespace>/<slug>@<major>`. The major version changes when what the probe tries
#   changes. Third parties publish probes under their own namespace, never `bohrin/`.
# * `expect` is what a correct grader does with the submission: `reject` (a negative control),
#   `accept` (a positive control) or `consistent` (the same verdict on a repeat).
# * `ground` is the ground a negative control rests on; positive controls have none.
# * `template.parameters` names what an instantiation must supply (a test root, a reward path).
#   Nothing in this library fills them in.
# * `attribution` says when a finding carries another of the probe's weaknesses than the first:
#   the first rule whose `when_rejected` probe the same grader rejected on the same task decides.
#   One submission can be paid for by graders with different defects, and the fix differs.
# * `maturity` starts at `experimental`. A probe becomes `stable` only after a public sample with
#   no confirmed false accusation and a 95% lower bound on precision of at least 95%.

[[probe]]
id = "bohrin/empty-implementation@1"
operator = "drop_side_effect"
weakness = ["BGW-101"]
title = "The reference with every function body replaced by pass"
shapes = ["program"]
ground = "structural"
expect = "reject"
maturity = "experimental"
battery = 2
guards = [
    "The reference does not parse, or defines no function: nothing is submitted.",
    "No function in the reference does work of its own (every body is a docstring, pass, ... or raise NotImplementedError, as in an interface): nothing is submitted.",
    "No function that does work is reachable: nothing is submitted, because replacing the body of a function nothing calls changes nothing a grader can see. A script (module-level code that does work, such as print(...) or main()) reaches only what that code names; a library also reaches its public functions and classes; then whatever a reachable function names, and a reachable class's public and special methods.",
    "The emptied program compiles to the same bytecode as the reference, because its bodies were already empty: nothing is submitted.",
]
sources = ["https://arxiv.org/abs/2604.17596", "https://link.springer.com/article/10.1007/s10664-018-9653-2"]

[probe.template]
solution = "reference-emptied"
parameters = []

[[probe]]
id = "bohrin/constant-implementation@1"
operator = "constant_implementation"
weakness = ["BGW-101"]
title = "The reference with every function returning a constant of its own return type"
shapes = ["program"]
ground = "structural"
expect = "reject"
maturity = "experimental"
battery = 2
guards = [
    "The reference does not parse, or no function in it does work of its own: nothing is submitted.",
    "No function that does work is reachable: nothing is submitted, because replacing the body of a function nothing calls changes nothing a grader can see. A script (module-level code that does work, such as print(...) or main()) reaches only what that code names; a library also reaches its public functions and classes; then whatever a reachable function names, and a reachable class's public and special methods.",
    "Every constant would be None (no return type is annotated or can be read from the reference): nothing is submitted, because that is the empty implementation again.",
    "Special methods (__init__, __eq__ and the like) are kept: Python fixes their return types, not the task. A reachable one that does work makes the submission a lead, never counted, because a grader may be checking only the work it kept.",
    "No reachable function of the reference both reads its inputs (parameters, self or cls) and returns a value the syntax does not fix: the submission is a lead, never counted, because the reference may itself return this constant.",
    "The result compiles to the same bytecode as the reference: nothing is submitted.",
]
sources = ["https://arxiv.org/abs/2604.17596"]

[probe.template]
solution = "reference-constant"
parameters = []

