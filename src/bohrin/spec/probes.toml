# --------------------------------------------------------------------------- positive controls
# A correct grader must accept these. They are never merged with the Coverage Score: they measure
# correct-work acceptance beside it, so a grader that rejects everything is exposed.

[[probe]]
id = "bohrin/oracle@1"
operator = "oracle"
weakness = ["BGW-124"]
title = "The task's reference solution, unchanged"
shapes = ["program"]
expect = "accept"
maturity = "experimental"
battery = 2
guards = ["If the grader rejects it, the task is a baseline failure: excluded from every rate, never scored."]
sources = ["https://arxiv.org/abs/2305.01210"]

[probe.template]
solution = "reference"
parameters = []

