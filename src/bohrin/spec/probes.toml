# Probe manifests: what every built-in probe tries, as data.
#
# A probe exists twice: as code (the operator that generates its submissions) and as this
# manifest, which a third-party tool or the conformance suite can read without importing Bohrin.
# tests/test_probes.py checks that each operator emits exactly what its manifest promises.
#
# * `id` is `<namespace>/<slug>@<major>`. The major version changes when what the probe tries
#   changes. Third parties publish probes under their own namespace, never `bohrin/`.
# * `expect` is what a correct grader does with the submission: `reject` (a negative control),
#   `accept` (a positive control) or `consistent` (the same verdict on a repeat).
# * `ground` is the ground a negative control rests on; positive controls have none.
# * `template.parameters` names what an instantiation must supply (a test root, a reward path).
#   Nothing in this library fills them in.
# * `maturity` starts at `experimental`. A probe becomes `stable` only after a public sample with
#   no confirmed false accusation and a 95% lower bound on precision of at least 95%.

[[probe]]
id = "bohrin/empty-implementation@1"
operator = "drop_side_effect"
weakness = ["BGW-101"]
title = "The reference with every function body replaced by pass"
shapes = ["program"]
ground = "structural"
expect = "reject"
maturity = "experimental"
battery = 2
guards = [
    "The reference does not parse, or defines no function: nothing is submitted.",
    "No function in the reference does work of its own (every body is a docstring, pass, ... or raise NotImplementedError, as in an interface): nothing is submitted.",
    "The emptied program compiles to the same bytecode as the reference, because its bodies were already empty: nothing is submitted.",
]
sources = ["https://arxiv.org/abs/2604.17596", "https://link.springer.com/article/10.1007/s10664-018-9653-2"]

[probe.template]
solution = "reference-emptied"
parameters = []

# --------------------------------------------------------------------------- positive controls
# A correct grader must accept these. They are never merged with the Coverage Score: they measure
# correct-work acceptance beside it, so a grader that rejects everything is exposed.

[[probe]]
id = "bohrin/oracle@1"
operator = "oracle"
weakness = ["BGW-124"]
title = "The task's reference solution, unchanged"
shapes = ["program"]
expect = "accept"
maturity = "experimental"
battery = 2
guards = ["If the grader rejects it, the task is a baseline failure: excluded from every rate, never scored."]
sources = ["https://arxiv.org/abs/2305.01210"]

[probe.template]
solution = "reference"
parameters = []

[[probe]]
id = "bohrin/comment-free-oracle@1"
operator = "comment_free"
weakness = ["BGW-120"]
title = "The reference with its comments removed"
shapes = ["program"]
expect = "accept"
maturity = "experimental"
battery = 2
guards = ["Emitted only when the syntax tree is unchanged, and only when the reference has a comment."]
sources = ["https://openai.com/index/introducing-swe-bench-verified/", "https://arxiv.org/abs/2212.10264"]

[probe.template]
solution = "reference-rewritten"
parameters = []

[[probe]]
id = "bohrin/reformatted-oracle@1"
operator = "reformatted"
weakness = ["BGW-120"]
title = "The reference re-laid out by Python's own unparser"
shapes = ["program"]
expect = "accept"
maturity = "experimental"
battery = 2
guards = ["Emitted only when the syntax tree is unchanged and the layout actually differs."]
sources = ["https://openai.com/index/introducing-swe-bench-verified/", "https://arxiv.org/abs/2212.10264"]

[probe.template]
solution = "reference-rewritten"
parameters = []

[[probe]]
id = "bohrin/renamed-oracle@1"
operator = "renamed_locals"
weakness = ["BGW-120"]
title = "The reference with its local variables renamed"
shapes = ["program"]
expect = "accept"
maturity = "experimental"
battery = 2
guards = [
    "Parameters and function names are never renamed.",
    "A function that reads its own local names at run time (locals(), vars(), eval, exec, frame introspection), or has nested scopes, imports or match statements, is left unrenamed.",
    "Emitted only when the program compiles to the same bytecode up to the names of locals.",
]
sources = ["https://arxiv.org/abs/2212.10264", "https://arxiv.org/abs/2606.08960"]

[probe.template]
solution = "reference-rewritten"
parameters = []
